include: package:flutter_lints/flutter.yaml

# CLAUDE.md: "Do not suppress analyzer warnings simply to make checks pass."
# Anything ignored here must carry a written reason.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Money must never round-trip through double (D01), so an implicit or
    # mismatched numeric conversion is an error, not a warning.
    argument_type_not_assignable: error
    invalid_assignment: error
    # A missing return, or a dropped future in the sync engine or an RPC call,
    # is a correctness bug rather than a style issue.
    body_might_complete_normally: error
    unawaited_futures: error
    # Dead code usually means a state machine lost a branch.
    dead_code: error
    unused_import: error
    unused_local_variable: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # Correctness
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # Async
    avoid_void_async: true
    unawaited_futures: true

    # Style
    always_use_package_imports: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_constructors_first: true
    use_super_parameters: true
