name: CI

# Two jobs, deliberately independent (D35, ARCHITECTURE.md §13).
#
# A Flutter test exercises the client's intent; the security properties live in
# privileges, policies, constraints, and triggers that no Dart test touches.
# Neither job may be skipped because the other passed.
#
# No secret is required. The Flutter job builds nothing that needs a Supabase
# project, and the database job runs against a disposable local stack. The
# production service_role key never appears in CI (D37).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter — format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed --line-length 100 lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  database:
    name: Database — migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard migrations against tenant data
        # Migrations run against production. Fixture and jurisdiction values
        # belong in supabase/seed.sql, which never gets there (D31, D33).
        run: scripts/ci.sh guard

      - name: Start local Supabase stack
        # Only the database is needed; skipping the rest keeps the job fast.
        run: supabase start -x studio,realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Verify migrations apply from scratch
        # Forward-only migrations must replay cleanly on an empty database
        # (D34). This is what makes a promotion to staging predictable.
        run: supabase db reset

      - name: Lint migrations
        # Both schemas: `app` holds the helpers every RPC's security depends on.
        run: |
          supabase db lint --schema public --level warning
          supabase db lint --schema app --level warning

      - name: Run pgTAP suite
        run: supabase test db

  # Fails the workflow if either suite failed, so branch protection needs one
  # required check rather than tracking both.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [flutter, database]
    if: always()
    steps:
      - name: Verify both suites passed
        run: |
          if [ "${{ needs.flutter.result }}" != "success" ] || \
             [ "${{ needs.database.result }}" != "success" ]; then
            echo "flutter=${{ needs.flutter.result }} database=${{ needs.database.result }}"
            exit 1
          fi
          echo "Both suites passed."
